                  <span className="font-semibold max-w-[120px] truncate text-[#4a3e2e]">
                    {selectedNode ? selectedNode.label : (selectedEdge.label || 'Connection')}
                  </span>
                  <button
                    onClick={() => setMobileDrawer('inspector')}
                    className="px-2.5 py-1 rounded-lg bg-[#7c6143] text-[#fdfaf3] font-medium"
                  >
                    Edit
                  </button>
                  <button
                    onClick={() => {
                      if (selectedNode) handleDeleteNode(selectedNode.id);
                      if (selectedEdge) handleDeleteEdge(selectedEdge.id);
                    }}
                    className="p-1 text-rose-700 font-bold"
                  >
                    🗑
                  </button>
                  <button
                    onClick={() => { setSelectedNodeIds([]); setSelectedEdgeId(null); }}
                    className="p-1 text-[#72634f]"
                  >
                    ✕
                  </button>
                </div>
              )}
            </div>

            {/* RIGHT INSPECTOR (Desktop) */}
            <aside className="hidden md:flex w-[272px] bg-[#ede4d3] border-l border-[#d5c7ad] flex-col z-20 select-none overflow-y-auto">
              <div className="px-6 pt-6 pb-3 flex items-center justify-between">
                <h2 className="text-[12px] font-semibold uppercase tracking-[0.08em] text-[#4a3e2e]">INSPECTOR</h2>
              </div>

              {!selectedNode && !selectedEdge ? (
                <div className="flex-1 px-6 flex flex-col items-center justify-center text-center">
                  <p className="text-[13px] text-[#72634f] leading-relaxed max-w-[185px]">
                    Select a block or connection to edit its properties.
                  </p>
                  <div className="flex items-center gap-3 mt-5 text-[#9c8b70]">
                    <span className="w-8 h-[1px] bg-[#c5b69c]" />
                    <span className="text-sm text-[#a39176]">⚙</span>
                    <span className="w-8 h-[1px] bg-[#c5b69c]" />
                  </div>
                </div>
              ) : (
                <div className="px-5 pb-6 pt-2 space-y-4 text-xs text-[#3b3023]">
                  {selectedNode && (
                    <>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] flex justify-between mb-1">
                          <span>Block Text</span>
                          <span className="text-[10px] font-normal text-[#87755d]">Auto-fits box</span>
                        </label>
                        <textarea
                          value={selectedNode.label}
                          onChange={(e) => handleUpdateNode(selectedNode.id, { label: e.target.value })}
                          rows={3}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2.5 text-[#2c251d] outline-none"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Step Badge Number</label>
                        <input
                          type="number"
                          min="1"
                          value={selectedNode.stepIndex || 1}
                          onChange={(e) => handleUpdateNode(selectedNode.id, { stepIndex: parseInt(e.target.value) || 1 })}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2 text-[#2c251d] outline-none"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Block Shape</label>
                        <select
                          value={selectedNode.type}
                          onChange={(e) => handleUpdateNode(selectedNode.id, { type: e.target.value })}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2 text-[#2c251d] outline-none"
                        >
                          {SHAPE_TYPES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1.5">Studio Palette</label>
                        <div className="grid grid-cols-4 gap-2">
                          {COLOR_PRESETS.map((p, idx) => (
                            <button
                              key={idx}
                              onClick={() => handleUpdateNode(selectedNode.id, { fill: p.fill, stroke: p.stroke, text: p.text })}
                              className="h-7 rounded-lg border border-[#b5a489] flex items-center justify-center"
                              style={{ backgroundColor: p.fill }}
                            >
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: p.stroke }} />
                            </button>
                          ))}
                        </div>
                      </div>
                      <button
                        onClick={() => handleDeleteNode(selectedNode.id)}
                        className="w-full py-2 rounded-xl bg-[#a14538]/15 text-[#8f3529] font-semibold hover:bg-[#a14538]/25 transition border border-[#a14538]/30"
                      >
                        Delete Block
                      </button>
                    </>
                  )}

                  {selectedEdge && (
                    <>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Connection Label</label>
                        <input
                          type="text"
                          value={selectedEdge.label || ''}
                          onChange={(e) => handleUpdateEdge(selectedEdge.id, { label: e.target.value })}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2.5 text-[#2c251d] outline-none"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Flow Line Style</label>
                        <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#e3d8c3] rounded-xl border border-[#cfc0a5]">
                          {['orthogonal', 'curved', 'straight'].map(st => (
                            <button
                              key={st}
                              onClick={() => handleUpdateEdge(selectedEdge.id, { style: st })}
                              className={`p-1.5 rounded-lg capitalize ${
                                (selectedEdge.style || 'orthogonal') === st ? 'bg-[#7c6143] text-[#fdfaf3]' : 'text-[#5c4d3a]'
                              }`}
                            >
                              {st === 'orthogonal' ? 'Step' : st}
                            </button>
                          ))}
                        </div>
                      </div>
                      <button
                        onClick={() => handleDeleteEdge(selectedEdge.id)}
                        className="w-full py-2 rounded-xl bg-[#a14538]/15 text-[#8f3529] font-semibold hover:bg-[#a14538]/25 transition border border-[#a14538]/30"
                      >
                        Delete Connection
                      </button>
                    </>
                  )}
                </div>
              )}
            </aside>
          </div>

          {/* MOBILE DRAWER: SHAPES */}
          {mobileDrawer === 'shapes' && (
            <div className="fixed inset-0 z-50 md:hidden bg-black/45 backdrop-blur-xs flex flex-col justify-end">
              <div className="fixed inset-0" onClick={() => setMobileDrawer(null)} />
              <div className="relative bg-[#ede4d3] border-t border-[#d5c7ad] rounded-t-2xl max-h-[80vh] flex flex-col shadow-2xl p-4">
                <div className="flex items-center justify-between pb-3 border-b border-[#d5c7ad]">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#7c6143]"></span>
                    <h2 className="text-xs font-bold uppercase tracking-wider text-[#4a3e2e]">Add Flow Shape</h2>
                  </div>
                  <button onClick={() => setMobileDrawer(null)} className="p-1 rounded-lg text-[#72634f] hover:bg-[#d8cbb3]">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto py-3 space-y-2">
                  <div className="grid grid-cols-2 gap-2">
                    {SHAPE_TYPES.map(shape => (
                      <div
                        key={shape.id}
                        onClick={() => addNodeFromSidebar(shape)}
                        className="flex items-center gap-2.5 p-2.5 rounded-xl bg-[#f3ecde] border border-[#d6c8b0] active:scale-98 transition shadow-xs cursor-pointer"
                      >
                        <ShapeMiniature id={shape.id} />
                        <span className="text-xs font-medium text-[#3b3023] leading-tight">{shape.name}</span>
                      </div>
                    ))}
                  </div>
                  <div className="pt-3 border-t border-[#d8cbb3]">
                    <h3 className="text-[11px] font-semibold uppercase tracking-wider text-[#6d5d47] mb-1.5">Default Flow Line Style</h3>
                    <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#e3d8c3] rounded-xl border border-[#cfc0a5]">
                      {[
                        { id: 'orthogonal', label: 'Step' },
                        { id: 'curved', label: 'Curve' },
                        { id: 'straight', label: 'Direct' }
                      ].map(st => (
                        <button
                          key={st.id}
                          onClick={() => setActiveConnectorStyle(st.id)}
                          className={`py-1.5 rounded-lg text-[11px] font-medium transition ${
                            activeConnectorStyle === st.id ? 'bg-[#7c6143] text-[#fdfaf3]' : 'text-[#5c4d3a]'
                          }`}
                        >
                          {st.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MOBILE DRAWER: INSPECTOR */}
          {mobileDrawer === 'inspector' && (
            <div className="fixed inset-0 z-50 md:hidden bg-black/45 backdrop-blur-xs flex flex-col justify-end">
              <div className="fixed inset-0" onClick={() => setMobileDrawer(null)} />
              <div className="relative bg-[#ede4d3] border-t border-[#d5c7ad] rounded-t-2xl max-h-[85vh] flex flex-col shadow-2xl p-4">
                <div className="flex items-center justify-between pb-3 border-b border-[#d5c7ad]">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#7c6143]"></span>
                    <h2 className="text-xs font-bold uppercase tracking-wider text-[#4a3e2e]">
                      {selectedNode ? 'Edit Block' : 'Edit Connection'}
                    </h2>
                  </div>
                  <button onClick={() => setMobileDrawer(null)} className="p-1 rounded-lg text-[#72634f] hover:bg-[#d8cbb3]">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto py-3 space-y-3.5 text-xs text-[#3b3023]">
                  {selectedNode && (
                    <>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] flex justify-between mb-1">
                          <span>Block Text</span>
                          <span className="text-[10px] font-normal text-[#87755d]">Auto-fits box</span>
                        </label>
                        <textarea
                          value={selectedNode.label}
                          onChange={(e) => handleUpdateNode(selectedNode.id, { label: e.target.value })}
                          rows={2}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2.5 text-[#2c251d] outline-none"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Step Badge Number</label>
                        <input
                          type="number"
                          min="1"
                          value={selectedNode.stepIndex || 1}
                          onChange={(e) => handleUpdateNode(selectedNode.id, { stepIndex: parseInt(e.target.value) || 1 })}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2 text-[#2c251d] outline-none"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Block Shape</label>
                        <select
                          value={selectedNode.type}
                          onChange={(e) => handleUpdateNode(selectedNode.id, { type: e.target.value })}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2 text-[#2c251d] outline-none"
                        >
                          {SHAPE_TYPES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1.5">Color Palette</label>
                        <div className="grid grid-cols-4 gap-2">
                          {COLOR_PRESETS.map((p, idx) => (
                            <button
                              key={idx}
                              onClick={() => handleUpdateNode(selectedNode.id, { fill: p.fill, stroke: p.stroke, text: p.text })}
                              className="h-8 rounded-lg border border-[#b5a489] flex items-center justify-center"
                              style={{ backgroundColor: p.fill }}
                            >
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: p.stroke }} />
                            </button>
                          ))}
                        </div>
                      </div>
                      <button
                        onClick={() => { handleDeleteNode(selectedNode.id); setMobileDrawer(null); }}
                        className="w-full py-2.5 rounded-xl bg-[#a14538]/15 text-[#8f3529] font-semibold hover:bg-[#a14538]/25 transition border border-[#a14538]/30"
                      >
                        Delete Block
                      </button>
                    </>
                  )}

                  {selectedEdge && (
                    <>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Connection Label</label>
                        <input
                          type="text"
                          value={selectedEdge.label || ''}
                          onChange={(e) => handleUpdateEdge(selectedEdge.id, { label: e.target.value })}
                          className="w-full bg-[#f6f1e6] border border-[#cfc0a5] rounded-xl p-2.5 text-[#2c251d] outline-none"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-[#5c4d3a] block mb-1">Flow Line Style</label>
                        <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#e3d8c3] rounded-xl border border-[#cfc0a5]">
                          {['orthogonal', 'curved', 'straight'].map(st => (
                            <button
                              key={st}
                              onClick={() => handleUpdateEdge(selectedEdge.id, { style: st })}
                              className={`p-1.5 rounded-lg capitalize ${
                                (selectedEdge.style || 'orthogonal') === st ? 'bg-[#7c6143] text-[#fdfaf3]' : 'text-[#5c4d3a]'
                              }`}
                            >
                              {st === 'orthogonal' ? 'Step' : st}
                            </button>
                          ))}
                        </div>
                      </div>
                      <button
                        onClick={() => { handleDeleteEdge(selectedEdge.id); setMobileDrawer(null); }}
                        className="w-full py-2.5 rounded-xl bg-[#a14538]/15 text-[#8f3529] font-semibold hover:bg-[#a14538]/25 transition border border-[#a14538]/30"
                      >
                        Delete Connection
                      </button>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TEMPLATES MODAL */}
          {showTemplates && (
            <div className="fixed inset-0 z-50 bg-[#2c251d]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-[#f5efe2] border border-[#cfc0a5] rounded-2xl p-6 relative text-[#2c251d] shadow-2xl">
                <button onClick={() => setShowTemplates(false)} className="absolute top-4 right-4 text-[#72634f] hover:text-[#2c251d]">✕</button>
                <h2 className="text-base font-bold mb-1">Templates & Presets</h2>
                <p className="text-xs text-[#72634f] mb-4">Load a pre-built workflow onto the canvas</p>
                <div className="space-y-2.5">
                  {PRESET_TEMPLATES.map(tpl => (
                    <div
                      key={tpl.id}
                      onClick={() => {
                        const fitted = tpl.nodes.map(n => {
                          const l = computeAutoNodeLayout(n);
                          return { ...n, width: l.width, height: l.height };
                        });
                        setNodes(fitted);
                        setEdges(tpl.edges);
                        saveSnapshot(fitted, tpl.edges);
                        setShowTemplates(false);
                        setTimeout(() => fitNodesToView(fitted), 80);
                      }}
                      className="p-3.5 bg-[#ede4d3] hover:bg-[#e5d9c3] border border-[#cfc0a5] rounded-xl cursor-pointer transition"
                    >
                      <div className="text-xs font-bold text-[#2c251d]">{tpl.name}</div>
                      <div className="text-[11px] text-[#6d5d47] mt-0.5">{tpl.description}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* EXPORT MODAL */}
          {showExport && (
            <div className="fixed inset-0 z-50 bg-[#2c251d]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#f5efe2] border border-[#cfc0a5] rounded-2xl p-6 relative text-[#2c251d] shadow-2xl">
                <button onClick={() => setShowExport(false)} className="absolute top-4 right-4 text-[#72634f] hover:text-[#2c251d]">✕</button>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-xl bg-[#7c6143]/15 text-[#7c6143] flex items-center justify-center border border-[#7c6143]/30">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-base font-bold mb-0.5">Export Flowchart</h2>
                    <p className="text-xs text-[#72634f]">Save or download your diagram</p>
                  </div>
                </div>
                <div className="space-y-2.5">
                  <button
                    onClick={() => { downloadFlowchartImage(); setShowExport(false); }}
                    className="w-full p-3 rounded-xl bg-[#7c6143] hover:bg-[#695136] font-semibold text-xs text-[#fdfaf3] shadow flex items-center justify-between"
                  >
                    <div className="text-left">
                      <div>Download Picture of Flowchart (PNG)</div>
                      <div className="text-[10px] font-normal opacity-85">Shows only flowchart with clean padding & 2x sharpness</div>
                    </div>
                    <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-md uppercase tracking-wider">Image</span>
                  </button>

                  <button
                    onClick={() => {
                      const result = generateFlowchartSvgString();
                      if (!result) return;
                      const blob = new Blob([result.svgStr], { type: 'image/svg+xml;charset=utf-8' });
                      const a = document.createElement('a');
                      a.href = URL.createObjectURL(blob);
                      a.download = `flowcanvas-${Date.now()}.svg`;
                      a.click();
                      setShowExport(false);
                    }}
                    className="w-full p-3 rounded-xl bg-[#ede4d3] hover:bg-[#e3d7c1] border border-[#cfc0a5] font-semibold text-xs text-[#2c251d] flex items-center justify-between"
                  >
                    <div className="text-left">
                      <div>Download Vector SVG</div>
                      <div className="text-[10px] font-normal text-[#72634f]">Crisp lossless vector format</div>
                    </div>
                    <span className="text-[10px] bg-[#d5c7ad] px-2 py-0.5 rounded-md">Vector</span>
                  </button>

                  <button
                    onClick={() => {
                      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ version: '1.0', theme: theme.id, nodes, edges }, null, 2));
                      const a = document.createElement('a');
                      a.setAttribute("href", dataStr);
                      a.setAttribute("download", `flowcanvas-${Date.now()}.json`);
                      a.click();
                      setShowExport(false);
                    }}
                    className="w-full p-3 rounded-xl bg-[#ede4d3] hover:bg-[#e3d7c1] border border-[#cfc0a5] font-semibold text-xs text-[#2c251d] flex items-center justify-between"
                  >
                    <div className="text-left">
                      <div>Download Editable JSON Project</div>
                      <div className="text-[10px] font-normal text-[#72634f]">Can be re-imported anytime</div>
                    </div>
                    <span className="text-[10px] bg-[#d5c7ad] px-2 py-0.5 rounded-md">JSON</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PRESENTATION MODAL */}
          {showPresentation && (
            <div className="fixed inset-0 z-50 bg-[#231d16]/95 flex flex-col justify-between p-3 sm:p-6 select-none">
              <div className="flex items-center justify-between text-[#f6efe0]">
                <h2 className="text-xs sm:text-sm font-bold truncate max-w-[70vw]">FlowCanvas Presentation (Step {presStepIdx + 1} of {sizedNodes.length})</h2>
                <button onClick={() => setShowPresentation(false)} className="px-3 py-1.5 bg-[#3a3024] text-[#e6dcc8] rounded-xl text-xs font-semibold">Exit</button>
              </div>
              <div className={`flex-1 my-3 sm:my-4 rounded-2xl border border-[#cfc0a5] overflow-hidden flex items-center justify-center ${theme.canvasBgClass}`}>
                <svg className="w-full h-full" viewBox="0 0 1250 560" preserveAspectRatio="xMidYMid meet">
                  {edges.map(edge => {
                    const sn = sizedNodesMap[edge.from];
                    const tn = sizedNodesMap[edge.to];
                    if (!sn || !tn) return null;
                    const { fromPort, toPort } = getBestPortPair(sn, tn, edge);
                    const pathInfo = calculatePathData(fromPort, toPort, edge.style || 'orthogonal');
                    return <path key={edge.id} d={pathInfo.d} fill="none" stroke="#7c6143" strokeWidth="2.2" className="animate-flow" />;
                  })}
                  {sizedNodes.map((node, idx) => {
                    const isActive = idx === presStepIdx;
                    const lines = node._lines || [node.label];
                    const lineHeight = node._lineHeight || 18;
                    const fontSize = node.fontSize || 13;
                    const totalTextHeight = lines.length * lineHeight;
                    const startTextY = (node.height - totalTextHeight) / 2 + fontSize * 0.82;
                    return (
                      <g key={node.id} transform={`translate(${node.x}, ${node.y})`} style={{ opacity: idx <= presStepIdx ? 1 : 0.3 }}>
                        {renderNodeSvgShape(node, isActive, theme)}
                        <text x={node.width / 2} textAnchor="middle" fill={node.text || '#2c251d'} fontSize={fontSize} fontWeight="500">
                          {lines.map((l, i) => <tspan key={i} x={node.width / 2} y={startTextY + i * lineHeight}>{l}</tspan>)}
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>
              <div className="flex items-center justify-between bg-[#efe7d6] border border-[#cfc0a5] rounded-xl sm:rounded-2xl px-4 sm:px-6 py-2.5 sm:py-3">
                <button onClick={() => setPresStepIdx(0)} className="px-3 py-1.5 rounded-xl bg-[#e3d8c3] text-xs font-medium">Restart</button>
                <div className="flex gap-2">
                  <button onClick={() => setPresStepIdx(p => Math.max(0, p - 1))} disabled={presStepIdx === 0} className="px-3.5 sm:px-4 py-1.5 rounded-xl bg-[#e3d8c3] disabled:opacity-40 text-xs font-medium">Previous</button>
                  <button onClick={() => setPresStepIdx(p => Math.min(sizedNodes.length - 1, p + 1))} disabled={presStepIdx === sizedNodes.length - 1} className="px-4 sm:px-5 py-1.5 rounded-xl bg-[#7c6143] text-[#fdfaf3] disabled:opacity-40 text-xs font-semibold">Next Step</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
