      try { window.localStorage?.clear(); } catch (e) {}
      try { window.sessionStorage?.clear(); } catch (e) {}
      try {
        if (window.indexedDB && typeof window.indexedDB.databases === 'function') {
          window.indexedDB.databases().then((dbs) => {
            dbs.forEach((db) => {
              if (db && db.name) window.indexedDB.deleteDatabase(db.name);
            });
          }).catch(() => {});
        }
      } catch (e) {}
      try {
        if ('caches' in window) {
          caches.keys().then((names) => {
            names.forEach((name) => caches.delete(name));
          }).catch(() => {});
        }
      } catch (e) {}
      try {
        if (document.cookie) {
          document.cookie.split(';').forEach((c) => {
            document.cookie = c
              .replace(/^ +/, '')
              .replace(/=.*/, '=;expires=' + new Date(0).toUTCString() + ';path=/');

    // --- GEOMETRY & AUTO-FIT NODE SIZING HELPERS ---
    function getNodePorts(node) {
      const { x, y, width, height, type } = node;
      const halfW = width / 2;
      const halfH = height / 2;
      const centerX = x + halfW;
      const centerY = y + halfH;

      if (type === 'input' || type === 'parallelogram') {
        const skew = Math.min(20, width * 0.15);
        return {
          top: { x: centerX, y: y, dir: 'top' },
          right: { x: x + width - skew / 2, y: centerY, dir: 'right' },
          bottom: { x: centerX, y: y + height, dir: 'bottom' },
          left: { x: x + skew / 2, y: centerY, dir: 'left' },
          center: { x: centerX, y: centerY, dir: 'center' }
        };
      }

      if (type === 'document') {
        return {
          top: { x: centerX, y: y, dir: 'top' },
          right: { x: x + width, y: centerY - 3, dir: 'right' },
          bottom: { x: centerX, y: y + height - 6, dir: 'bottom' },
          left: { x: x, y: centerY - 3, dir: 'left' },
          center: { x: centerX, y: centerY, dir: 'center' }
        };
      }

      return {
        top: { x: centerX, y: y, dir: 'top' },
        right: { x: x + width, y: centerY, dir: 'right' },
        bottom: { x: centerX, y: y + height, dir: 'bottom' },
        left: { x: x, y: centerY, dir: 'left' },
        center: { x: centerX, y: centerY, dir: 'center' }
      };
    }

    function getBestPortPair(sourceNode, targetNode, edge = null) {
      const sPorts = getNodePorts(sourceNode);
      const tPorts = getNodePorts(targetNode);

      if (edge && edge.fromPort && edge.toPort && sPorts[edge.fromPort] && tPorts[edge.toPort]) {
        return {
          fromPort: sPorts[edge.fromPort],
          toPort: tPorts[edge.toPort],
          fromDir: edge.fromPort,
          toDir: edge.toPort
        };
      }

      const sCenter = sPorts.center;
      const tCenter = tPorts.center;
      const dx = tCenter.x - sCenter.x;
      const dy = tCenter.y - sCenter.y;

      const portKeys = ['top', 'right', 'bottom', 'left'];
      let bestScore = Infinity;
      let bestPair = { fromPort: sPorts.right, toPort: tPorts.left, fromDir: 'right', toDir: 'left' };

      portKeys.forEach(sKey => {
        portKeys.forEach(tKey => {
          if (sourceNode.id === targetNode.id && sKey === tKey) return;
          const sp = sPorts[sKey];
          const tp = tPorts[tKey];
          const dist = Math.hypot(tp.x - sp.x, tp.y - sp.y);

          let penalty = 0;
          if (sKey === 'right' && dx < -20) penalty += 120;
          if (sKey === 'left' && dx > 20) penalty += 120;
          if (sKey === 'bottom' && dy < -20) penalty += 120;
          if (sKey === 'top' && dy > 20) penalty += 120;

          if (tKey === 'left' && dx < -20) penalty += 120;
          if (tKey === 'right' && dx > 20) penalty += 120;
          if (tKey === 'top' && dy < -20) penalty += 120;
          if (tKey === 'bottom' && dy > 20) penalty += 120;

          const isNaturalOpposite =
            (sKey === 'right' && tKey === 'left' && dx >= 0) ||
            (sKey === 'left' && tKey === 'right' && dx <= 0) ||
            (sKey === 'bottom' && tKey === 'top' && dy >= 0) ||
            (sKey === 'top' && tKey === 'bottom' && dy <= 0);

          if (isNaturalOpposite) penalty -= 35;

          const score = dist + penalty;
          if (score < bestScore) {
            bestScore = score;
            bestPair = {
              fromPort: edge?.fromPort && sPorts[edge.fromPort] ? sPorts[edge.fromPort] : sp,
              toPort: edge?.toPort && tPorts[edge.toPort] ? tPorts[edge.toPort] : tp,
              fromDir: edge?.fromPort || sKey,
              toDir: edge?.toPort || tKey
            };
          }
        });
      });

      return bestPair;
    }

    function stepPort(pt, dist = 24) {
      if (pt.dir === 'right') return { x: pt.x + dist, y: pt.y };
      if (pt.dir === 'left') return { x: pt.x - dist, y: pt.y };
      if (pt.dir === 'bottom') return { x: pt.x, y: pt.y + dist };
      if (pt.dir === 'top') return { x: pt.x, y: pt.y - dist };
      return { x: pt.x, y: pt.y };
    }

    function buildRoundedOrthogonalPath(points, radius = 8) {
      if (points.length < 2) return '';
      if (points.length === 2) {
        return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
      }

      const pts = [points[0]];
      for (let i = 1; i < points.length; i++) {
        if (Math.hypot(points[i].x - pts[pts.length - 1].x, points[i].y - pts[pts.length - 1].y) > 0.5) {
          pts.push(points[i]);
        }
      }
      if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y}`;
      if (pts.length === 2) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;

      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const prev = pts[i - 1];
        const curr = pts[i];
        const next = pts[i + 1];

        const v1x = curr.x - prev.x;
        const v1y = curr.y - prev.y;
        const len1 = Math.hypot(v1x, v1y);

        const v2x = next.x - curr.x;
        const v2y = next.y - curr.y;
        const len2 = Math.hypot(v2x, v2y);

        const r = Math.min(radius, len1 / 2, len2 / 2);
        if (r < 1) {
          d += ` L ${curr.x} ${curr.y}`;
        } else {
          const startX = curr.x - (v1x / len1) * r;
          const startY = curr.y - (v1y / len1) * r;
          const endX = curr.x + (v2x / len2) * r;
          const endY = curr.y + (v2y / len2) * r;
          d += ` L ${startX.toFixed(1)} ${startY.toFixed(1)} Q ${curr.x.toFixed(1)} ${curr.y.toFixed(1)} ${endX.toFixed(1)} ${endY.toFixed(1)}`;
        }
      }
      const last = pts[pts.length - 1];
      d += ` L ${last.x} ${last.y}`;
      return d;
    }

    function calculatePathData(fromPoint, toPoint, style = 'orthogonal') {
      const { x: x1, y: y1, dir: dir1 = 'right' } = fromPoint;
      const { x: x2, y: y2, dir: dir2 = 'left' } = toPoint;

      if (style === 'straight') {
        return {
          d: `M ${x1} ${y1} L ${x2} ${y2}`,
          midPoint: { x: (x1 + x2) / 2, y: (y1 + y2) / 2 }
        };
      }

      if (style === 'curved') {
        const dist = Math.hypot(x2 - x1, y2 - y1);
        const offset = Math.max(Math.min(dist * 0.45, 140), 40);
        let cx1 = x1, cy1 = y1, cx2 = x2, cy2 = y2;

        if (dir1 === 'right') cx1 += offset;
        else if (dir1 === 'left') cx1 -= offset;
        else if (dir1 === 'bottom') cy1 += offset;
        else if (dir1 === 'top') cy1 -= offset;

        if (dir2 === 'right') cx2 += offset;
        else if (dir2 === 'left') cx2 -= offset;
        else if (dir2 === 'bottom') cy2 += offset;
        else if (dir2 === 'top') cy2 -= offset;
        else {
          cx2 = (x1 + x2) / 2;
          cy2 = (y1 + y2) / 2;
        }

        const midPoint = {
          x: 0.125 * x1 + 0.375 * cx1 + 0.375 * cx2 + 0.125 * x2,
          y: 0.125 * y1 + 0.375 * cy1 + 0.375 * cy2 + 0.125 * y2
        };

        return {
          d: `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`,
          midPoint
        };
      }

      const isHoriz1 = dir1 === 'left' || dir1 === 'right';
      const isHoriz2 = dir2 === 'left' || dir2 === 'right' || dir2 === 'center';

      const margin = 22;
      const p1 = { x: x1, y: y1 };
      const p2 = { x: x2, y: y2 };
      const s1 = stepPort(fromPoint, margin);
      const s2 = dir2 === 'center' ? p2 : stepPort(toPoint, margin);

      let points = [];

      if (dir2 === 'center') {
        if (isHoriz1) {
          const midX = (x1 + x2) / 2;
          points = [p1, { x: midX, y: y1 }, { x: midX, y: y2 }, p2];
        } else {
          const midY = (y1 + y2) / 2;
          points = [p1, { x: x1, y: midY }, { x: x2, y: midY }, p2];
        }
      } else if (isHoriz1 && isHoriz2) {
        const canGoDirectMid =
          (dir1 === 'right' && dir2 === 'left' && x2 >= x1 + 10) ||
          (dir1 === 'left' && dir2 === 'right' && x2 <= x1 - 10);

        if (canGoDirectMid) {
          const midX = (x1 + x2) / 2;
          points = [p1, { x: midX, y: y1 }, { x: midX, y: y2 }, p2];
        } else {
          const midY = (y1 + y2) / 2;
          points = [p1, s1, { x: s1.x, y: midY }, { x: s2.x, y: midY }, s2, p2];
        }
      } else if (!isHoriz1 && !isHoriz2) {
        const canGoDirectMid =
          (dir1 === 'bottom' && dir2 === 'top' && y2 >= y1 + 10) ||
          (dir1 === 'top' && dir2 === 'bottom' && y2 <= y1 - 10);

        if (canGoDirectMid) {
          const midY = (y1 + y2) / 2;
          points = [p1, { x: x1, y: midY }, { x: x2, y: midY }, p2];
        } else {
          const midX = (x1 + x2) / 2;
          points = [p1, s1, { x: midX, y: s1.y }, { x: midX, y: s2.y }, s2, p2];
        }
      } else if (isHoriz1 && !isHoriz2) {
        const dir1Ok = (dir1 === 'right' && x2 >= s1.x) || (dir1 === 'left' && x2 <= s1.x);
        const dir2Ok = (dir2 === 'top' && y1 <= s2.y) || (dir2 === 'bottom' && y1 >= s2.y);

        if (dir1Ok && dir2Ok) {
          points = [p1, { x: x2, y: y1 }, p2];
        } else {
          points = [p1, s1, { x: s1.x, y: s2.y }, s2, p2];
        }
      } else {
        const dir1Ok = (dir1 === 'bottom' && y2 >= s1.y) || (dir1 === 'top' && y2 <= s1.y);
        const dir2Ok = (dir2 === 'left' && x1 <= s2.x) || (dir2 === 'right' && x1 >= s2.x);

        if (dir1Ok && dir2Ok) {
          points = [p1, { x: x1, y: y2 }, p2];
        } else {
          points = [p1, s1, { x: s2.x, y: s1.y }, s2, p2];
        }
      }

      let totalLen = 0;
      const segLens = [];
      for (let i = 1; i < points.length; i++) {
        const l = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        segLens.push(l);
        totalLen += l;
      }

      let midPoint = { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
      let halfLen = totalLen / 2;
      let accum = 0;
      for (let i = 0; i < segLens.length; i++) {
        if (accum + segLens[i] >= halfLen && segLens[i] > 0) {
          const t = (halfLen - accum) / segLens[i];
          midPoint = {
            x: points[i].x + (points[i + 1].x - points[i].x) * t,
            y: points[i].y + (points[i + 1].y - points[i].y) * t
          };
          break;
        }
        accum += segLens[i];
      }

      return {
        d: buildRoundedOrthogonalPath(points, 8),
        midPoint
      };
    }

    function computeAutoNodeLayout(node) {
      const label = (node.label ?? '').toString();
      const fontSize = node.fontSize || 13;
      const type = node.type || 'process';

      const minDims = {
        terminal: { w: 130, h: 54 },
        process: { w: 145, h: 68 },
        decision: { w: 145, h: 100 },
        database: { w: 135, h: 86 },
        document: { w: 145, h: 80 },
        input: { w: 155, h: 66 },
        note: { w: 145, h: 96 }
      }[type] || { w: 145, h: 68 };

      const shapeFactor = {
        terminal: { padX: 36, padY: 26, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 22 },
        process: { padX: 28, padY: 26, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 22 },
        decision: { padX: 36, padY: 32, scaleW: 1.65, scaleH: 1.65, maxCharsPerLine: 16 },
        database: { padX: 28, padY: 42, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 20 },
        document: { padX: 28, padY: 36, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 20 },
        input: { padX: 48, padY: 26, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 20 },
        note: { padX: 28, padY: 28, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 22 }
      }[type] || { padX: 28, padY: 26, scaleW: 1.0, scaleH: 1.0, maxCharsPerLine: 22 };

      const rawParagraphs = label.split('\n');
      const lines = [];
      const targetWrapChars = Math.max(
        shapeFactor.maxCharsPerLine,
        Math.ceil(Math.sqrt(label.length) * 2.4)
      );

      rawParagraphs.forEach(para => {
        const words = para.trim().split(/\s+/).filter(Boolean);
        if (words.length === 0) {
          lines.push('');
          return;
        }
        let currentLine = words[0];
        for (let i = 1; i < words.length; i++) {
          const word = words[i];
          if ((currentLine + ' ' + word).length <= targetWrapChars) {
            currentLine += ' ' + word;
          } else {
            lines.push(currentLine);
            currentLine = word;
          }
        }
        lines.push(currentLine);
      });

      if (lines.length === 0) lines.push('');

      const charWidth = fontSize * 0.6;
      const lineHeight = Math.round(fontSize * 1.35);

      const longestLineChars = Math.max(...lines.map(l => l.length), 1);
      const textBlockWidth = longestLineChars * charWidth;
      const textBlockHeight = lines.length * lineHeight;

      const requiredWidth = Math.ceil(textBlockWidth * shapeFactor.scaleW + shapeFactor.padX);
      const requiredHeight = Math.ceil(textBlockHeight * shapeFactor.scaleH + shapeFactor.padY);

      const finalWidth = Math.max(minDims.w, requiredWidth, node.manualMinWidth || 0);
      const finalHeight = Math.max(minDims.h, requiredHeight, node.manualMinHeight || 0);

      return {
        width: finalWidth,
        height: finalHeight,
        lines,
        lineHeight
      };
    }

    function renderNodeSvgShape(node, isSelected, theme) {
      const { width, height, type, fill, stroke } = node;
      const strokeColor = isSelected ? (theme?.accent || '#7a5c3e') : (stroke || '#6d624d');
      const strokeW = isSelected ? '2.4' : '1.4';
      const shadowFilter = isSelected
        ? 'drop-shadow(0px 4px 10px rgba(90, 70, 45, 0.22))'
        : 'drop-shadow(0px 2px 4px rgba(74, 60, 44, 0.1))';

      if (type === 'terminal' || type === 'pill') {
        return (
          <rect
            width={width}
            height={height}
            rx="10"
            fill={fill}
            stroke={strokeColor}
            strokeWidth={strokeW}
            style={{ filter: shadowFilter }}
          />
        );
      }

      if (type === 'decision' || type === 'diamond') {
        const pts = `${width / 2},0 ${width},${height / 2} ${width / 2},${height} 0,${height / 2}`;
        return (
          <polygon
            points={pts}
            strokeLinejoin="round"
            fill={fill}
            stroke={strokeColor}
            strokeWidth={strokeW}
            style={{ filter: shadowFilter }}
          />
        );
      }

      if (type === 'database' || type === 'cylinder') {
        const rx = width / 2;
        const ry = 10;
        return (
          <g style={{ filter: shadowFilter }}>
            <path
              d={`M 0 ${ry} v ${height - 2 * ry} a ${rx} ${ry} 0 0 0 ${width} 0 v -${height - 2 * ry}`}
              fill={fill}
              stroke={strokeColor}
              strokeWidth={strokeW}
            />
            <ellipse
              cx={rx}
              cy={ry}
              rx={rx}
              ry={ry}
              fill={fill}
              stroke={strokeColor}
              strokeWidth={strokeW}
            />
          </g>
        );
      }

      if (type === 'document') {
        return (
          <path
            d={`M 0 0 H ${width} V ${height - 11} Q ${width * 0.75} ${height + 2} ${width * 0.5} ${height - 9} T 0 ${height - 11} Z`}
            fill={fill}
            stroke={strokeColor}
            strokeWidth={strokeW}
            style={{ filter: shadowFilter }}
          />
        );
      }

      if (type === 'input' || type === 'parallelogram') {
        const skew = Math.min(20, width * 0.15);
        const pts = `${skew},0 ${width},0 ${width - skew},${height} 0,${height}`;
        return (
          <polygon
            points={pts}
            strokeLinejoin="round"
            fill={fill}
            stroke={strokeColor}
            strokeWidth={strokeW}
            style={{ filter: shadowFilter }}
          />
        );
      }

      if (type === 'note') {
        return (
          <g style={{ filter: shadowFilter }}>
            <rect
              width={width}
              height={height}
              rx="6"
              fill={fill}
              stroke={strokeColor}
              strokeWidth={strokeW}
            />
            <path
              d={`M ${width - 14} ${height} L ${width} ${height - 14} L ${width - 14} ${height - 14} Z`}
              fill="rgba(90, 70, 45, 0.22)"
            />
          </g>
        );
      }

      return (
        <rect
          width={width}
          height={height}
          rx="9"
          fill={fill}
          stroke={strokeColor}
          strokeWidth={strokeW}
          style={{ filter: shadowFilter }}
        />
      );
    }

    function ShapeMiniature({ id }) {
      const stroke = '#736049';
      const fill = 'rgba(229, 217, 195, 0.5)';
      if (id === 'terminal') {
        return (
          <svg className="w-8 h-8" viewBox="0 0 36 36">

            <ellipse cx="18" cy="10" rx="12" ry="4.5" fill={fill} stroke={stroke} strokeWidth="1.4" />
          </svg>

      }
      if (id === 'document') {
        return (
          <svg className="w-8 h-8" viewBox="0 0 36 36">
            <path d="M 5 6 H 31 V 26 Q 24.5 31 18 26.5 T 5 26 Z" fill={fill} stroke={stroke} strokeWidth="1.4" />
            <text x="18" y="20" textAnchor="middle" fill="#433627" fontSize="10" fontWeight="600">D</text>
          </svg>
        );
      }
      if (id === 'input') {
        return (
          <svg className="w-8 h-8" viewBox="0 0 36 36">
            <polygon points="10,7 32,7 26,29 4,29" fill={fill} stroke={stroke} strokeWidth="1.4" />
          </svg>
        );
      }
      return (
        <svg className="w-8 h-8" viewBox="0 0 36 36">
          <rect x="5" y="5" width="26" height="26" rx="3" fill={fill} stroke={stroke} strokeWidth="1.4" />
          <path d="M 24 31 L 31 24 L 24 24 Z" fill="rgba(115, 96, 73, 0.35)" />
        </svg>
      );
    }

    // --- MAIN APPLICATION ---
    function App() {
      const [theme, setTheme] = useState(PRESENTATION_THEMES[0]);
      const [nodes, setNodes] = useState(() =>
        PRESET_TEMPLATES[0].nodes.map(n => {
          const layout = computeAutoNodeLayout(n);
          return { ...n, width: layout.width, height: layout.height };
        })
      );
      const [edges, setEdges] = useState(PRESET_TEMPLATES[0].edges);

      const [selectedNodeIds, setSelectedNodeIds] = useState([]);
      const [selectedEdgeId, setSelectedEdgeId] = useState(null);

      const [zoom, setZoom] = useState(1.0);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [activeConnectorStyle, setActiveConnectorStyle] = useState('orthogonal');
      const [mobileDrawer, setMobileDrawer] = useState(null); // 'shapes' | 'inspector' | null

      const [history, setHistory] = useState([{ nodes: PRESET_TEMPLATES[0].nodes, edges: PRESET_TEMPLATES[0].edges }]);
      const [historyIndex, setHistoryIndex] = useState(0);

      const [showPresentation, setShowPresentation] = useState(false);
      const [showExport, setShowExport] = useState(false);
      const [showTemplates, setShowTemplates] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [presStepIdx, setPresStepIdx] = useState(0);

      const containerRef = useRef(null);
      const fileInputRef = useRef(null);
      const [isPanning, setIsPanning] = useState(false);
      const [startPanMouse, setStartPanMouse] = useState({ x: 0, y: 0 });
      const [draggingNodeId, setDraggingNodeId] = useState(null);
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [snapLines, setSnapLines] = useState([]);
      const [connectingFrom, setConnectingFrom] = useState(null);
      const [hoveredPort, setHoveredPort] = useState(null);
      const [mouseCanvasPos, setMouseCanvasPos] = useState({ x: 0, y: 0 });

      // Touch gesture refs
      const touchStateRef = useRef({
        isPinching: false,
        startDist: 0,
        startZoom: 1,
        startCenter: { x: 0, y: 0 },
        startPan: { x: 0, y: 0 },
        touchStartPos: { x: 0, y: 0 },
        touchStartTime: 0,
        hasMoved: false
      });
      const draggingTouchNodeRef = useRef(null);
      const connectingTouchPortRef = useRef(null);

      const [editingNodeId, setEditingNodeId] = useState(null);
      const [editingEdgeId, setEditingEdgeId] = useState(null);
      const [tempLabel, setTempLabel] = useState('');

      // Wipe all saved data on startup and when leaving/exiting the website
      useEffect(() => {
        purgeAllUserDataAndStorage();
        const handleExit = () => purgeAllUserDataAndStorage();
        window.addEventListener('beforeunload', handleExit);
        window.addEventListener('pagehide', handleExit);
        window.addEventListener('unload', handleExit);
        return () => {
          window.removeEventListener('beforeunload', handleExit);
          window.removeEventListener('pagehide', handleExit);
          window.removeEventListener('unload', handleExit);
          purgeAllUserDataAndStorage();
        };
      }, []);

      const saveSnapshot = useCallback((newNodes, newEdges) => {
        setHistory(prev => {
          const sliced = prev.slice(Math.max(0, historyIndex - 39), historyIndex + 1);
          const next = [...sliced, { nodes: newNodes, edges: newEdges }];
          setHistoryIndex(next.length - 1);
          return next;
        });
      }, [historyIndex]);

      const handleUndo = useCallback(() => {
        if (historyIndex > 0) {
          const prev = history[historyIndex - 1];
          setNodes(prev.nodes);
          setEdges(prev.edges);
          setHistoryIndex(historyIndex - 1);
        }
      }, [history, historyIndex]);

      const handleRedo = useCallback(() => {
        if (historyIndex < history.length - 1) {
          const next = history[historyIndex + 1];
          setNodes(next.nodes);
          setEdges(next.edges);
          setHistoryIndex(historyIndex + 1);
        }
      }, [history, historyIndex]);

      const handleUpdateNode = useCallback((nodeId, updates, isAdd = false, skipHistory = false) => {
        setNodes(prevNodes => {
          let nextNodes;
          if (isAdd) {
            const layout = computeAutoNodeLayout(updates);
            nextNodes = [...prevNodes, { ...updates, width: layout.width, height: layout.height }];
          } else {
            nextNodes = prevNodes.map(n => {
              if (n.id !== nodeId) return n;
              const merged = { ...n, ...updates };
              const layout = computeAutoNodeLayout(merged);
              const dw = layout.width - n.width;
              const dh = layout.height - n.height;
              const shouldRecenter = ('label' in updates || 'fontSize' in updates || 'type' in updates) && !('x' in updates);
              return {
                ...merged,
                width: layout.width,
                height: layout.height,
                x: shouldRecenter ? Math.round(merged.x - dw / 2) : merged.x,
                y: shouldRecenter ? Math.round(merged.y - dh / 2) : merged.y
              };
            });
          }
          if (!skipHistory) {
            saveSnapshot(nextNodes, edges);
          }
          return nextNodes;
        });
      }, [edges, saveSnapshot]);

      const handleDeleteNode = useCallback((nodeId) => {
        const nextNodes = nodes.filter(n => n.id !== nodeId);
        const nextEdges = edges.filter(e => e.from !== nodeId && e.to !== nodeId);
        setNodes(nextNodes);
        setEdges(nextEdges);
        setSelectedNodeIds([]);
        saveSnapshot(nextNodes, nextEdges);
      }, [nodes, edges, saveSnapshot]);

      const handleUpdateEdge = useCallback((edgeId, updates) => {
        const nextEdges = edges.map(e => e.id === edgeId ? { ...e, ...updates } : e);
        setEdges(nextEdges);
        saveSnapshot(nodes, nextEdges);
      }, [edges, nodes, saveSnapshot]);

      const handleDeleteEdge = useCallback((edgeId) => {
        const nextEdges = edges.filter(e => e.id !== edgeId);
        setEdges(nextEdges);
        setSelectedEdgeId(null);
        saveSnapshot(nodes, nextEdges);
      }, [edges, nodes, saveSnapshot]);

      const screenToCanvas = (sx, sy) => {
        if (!containerRef.current) return { x: 0, y: 0 };
        const rect = containerRef.current.getBoundingClientRect();
        return {
          x: (sx - rect.left - pan.x) / zoom,
          y: (sy - rect.top - pan.y) / zoom
        };
      };

      // Fit and center all nodes nicely into the screen
      const fitNodesToView = useCallback((customNodes = null) => {
        const targetNodes = customNodes || nodes;
        if (!targetNodes || targetNodes.length === 0) return;
        const container = containerRef.current;
        const cWidth = container?.clientWidth || window.innerWidth;
        const cHeight = container?.clientHeight || (window.innerHeight - 68);

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        targetNodes.forEach(n => {
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + (n.width || 150));
          maxY = Math.max(maxY, n.y + (n.height || 76));
        });

        const diagramWidth = Math.max(120, maxX - minX);
        const diagramHeight = Math.max(100, maxY - minY);
        const padding = window.innerWidth < 768 ? 24 : 60;

        const scaleX = (cWidth - padding * 2) / diagramWidth;
        const scaleY = (cHeight - padding * 2) / diagramHeight;
        const targetZoom = Math.min(1.0, Math.max(0.3, Math.min(scaleX, scaleY)));

        const centerX = minX + diagramWidth / 2;
        const centerY = minY + diagramHeight / 2;

        const newPanX = cWidth / 2 - centerX * targetZoom;
        const newPanY = cHeight / 2 - centerY * targetZoom;

        setZoom(+targetZoom.toFixed(2));
        setPan({ x: Math.round(newPanX), y: Math.round(newPanY) });
      }, [nodes]);

      // Automatically auto-fit flowchart to screen on first render
      useEffect(() => {
        const timer = setTimeout(() => {
          fitNodesToView();
        }, 120);
        return () => clearTimeout(timer);
      }, []);

      const saveInlineLabel = () => {
        if (editingNodeId) {
          handleUpdateNode(editingNodeId, { label: tempLabel });
          setEditingNodeId(null);
        }
        if (editingEdgeId) {
          handleUpdateEdge(editingEdgeId, { label: tempLabel });
          setEditingEdgeId(null);
        }
      };

      // Smooth Wheel Zoom & Pan
      const handleWheel = (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const delta = -e.deltaY * 0.0015;
          const nextZoom = Math.min(2.2, Math.max(0.3, +(zoom + delta).toFixed(2)));
          setZoom(nextZoom);
        } else {
          setPan(prev => ({
            x: prev.x - e.deltaX * 0.6,
            y: prev.y - e.deltaY * 0.6
          }));
        }
      };

      // Mouse events
      const handleCanvasMouseDown = (e) => {
        if (e.target.tagName === 'svg' || e.target.classList.contains('canvas-bg')) {
          if (editingNodeId || editingEdgeId) saveInlineLabel();
          setSelectedNodeIds([]);
          setSelectedEdgeId(null);
          setIsPanning(true);
          setStartPanMouse({ x: e.clientX - pan.x, y: e.clientY - pan.y });
        }
      };

      const handleCanvasMouseMove = (e) => {
        const cPos = screenToCanvas(e.clientX, e.clientY);
        setMouseCanvasPos(cPos);

        if (isPanning) {
          setPan({ x: e.clientX - startPanMouse.x, y: e.clientY - startPanMouse.y });
          return;
        }

        if (draggingNodeId) {
          let newX = cPos.x - dragOffset.x;
          let newY = cPos.y - dragOffset.y;

          const currNode = nodes.find(n => n.id === draggingNodeId);
          if (currNode) {
            const layout = computeAutoNodeLayout(currNode);
            const newSnapLines = [];
            const cCenterX = newX + layout.width / 2;
            const cCenterY = newY + layout.height / 2;

            nodes.forEach(other => {
              if (other.id === draggingNodeId) return;
              const oLayout = computeAutoNodeLayout(other);
              const oCenterX = other.x + oLayout.width / 2;
              const oCenterY = other.y + oLayout.height / 2;

              if (Math.abs(cCenterX - oCenterX) < 8) {
                newX = oCenterX - layout.width / 2;
                newSnapLines.push({ type: 'x', x: oCenterX });
              }
              if (Math.abs(cCenterY - oCenterY) < 8) {
                newY = oCenterY - layout.height / 2;
                newSnapLines.push({ type: 'y', y: oCenterY });
              }
            });
            setSnapLines(newSnapLines);
          }

          handleUpdateNode(draggingNodeId, { x: Math.round(newX), y: Math.round(newY) }, false, true);
        }
      };

      const handleCanvasMouseUp = () => {
        if (draggingNodeId) {
          saveSnapshot(nodes, edges);
        }
        setIsPanning(false);
        setDraggingNodeId(null);
        setSnapLines([]);
        setConnectingFrom(null);
      };

      // --- MOBILE TOUCH EVENT HANDLERS ---
      const handleCanvasTouchStart = (e) => {
        if (editingNodeId || editingEdgeId) saveInlineLabel();

        if (e.touches.length === 1) {
          const t = e.touches[0];
          touchStateRef.current = {
            isPinching: false,
            startDist: 0,
            startZoom: zoom,
            startCenter: { x: t.clientX, y: t.clientY },
            startPan: { ...pan },
            touchStartPos: { x: t.clientX, y: t.clientY },
            touchStartTime: Date.now(),
            hasMoved: false
          };
          setIsPanning(true);
          setStartPanMouse({ x: t.clientX - pan.x, y: t.clientY - pan.y });
        } else if (e.touches.length === 2) {
          setIsPanning(false);
          const t0 = e.touches[0];
          const t1 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
          touchStateRef.current = {
            isPinching: true,
            startDist: dist,
            startZoom: zoom,
            startCenter: center,
            startPan: { ...pan },
            touchStartPos: center,
            touchStartTime: Date.now(),
            hasMoved: true
          };
        }
      };

      const handleCanvasTouchMove = (e) => {
        if (e.cancelable) e.preventDefault();

        // 1. Touch drag a node
        if (draggingTouchNodeRef.current && e.touches.length === 1) {
          const t = e.touches[0];
          const info = draggingTouchNodeRef.current;
          const dx = (t.clientX - info.startX) / zoom;
          const dy = (t.clientY - info.startY) / zoom;
          if (Math.hypot(dx, dy) > 3) info.hasMoved = true;

          let newX = info.nodeStartX + dx;
          let newY = info.nodeStartY + dy;

          const currNode = nodes.find(n => n.id === info.nodeId);
          if (currNode) {
            const layout = computeAutoNodeLayout(currNode);
            const newSnapLines = [];
            const cCenterX = newX + layout.width / 2;
            const cCenterY = newY + layout.height / 2;

            nodes.forEach(other => {
              if (other.id === info.nodeId) return;
              const oLayout = computeAutoNodeLayout(other);
              const oCenterX = other.x + oLayout.width / 2;
              const oCenterY = other.y + oLayout.height / 2;

              if (Math.abs(cCenterX - oCenterX) < 8) {
                newX = oCenterX - layout.width / 2;
                newSnapLines.push({ type: 'x', x: oCenterX });
              }
              if (Math.abs(cCenterY - oCenterY) < 8) {
                newY = oCenterY - layout.height / 2;
                newSnapLines.push({ type: 'y', y: oCenterY });
              }
            });
            setSnapLines(newSnapLines);
          }

          handleUpdateNode(info.nodeId, { x: Math.round(newX), y: Math.round(newY) }, false, true);
          return;
        }

        // 2. Touch connecting line
        if (connectingTouchPortRef.current && e.touches.length === 1) {
          const t = e.touches[0];
          const cPos = screenToCanvas(t.clientX, t.clientY);
          setMouseCanvasPos(cPos);
          return;
        }

        // 3. Pinch-to-zoom (2 fingers)
        if (touchStateRef.current.isPinching && e.touches.length === 2) {
          const t0 = e.touches[0];
          const t1 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const currCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
          const { startDist, startZoom, startCenter, startPan } = touchStateRef.current;
          if (startDist > 0) {
            const scale = dist / startDist;
            const nextZoom = Math.min(2.2, Math.max(0.3, +(startZoom * scale).toFixed(2)));
            const ratio = nextZoom / startZoom;
            const nextPanX = currCenter.x - (startCenter.x - startPan.x) * ratio;
            const nextPanY = currCenter.y - (startCenter.y - startPan.y) * ratio;
            setZoom(nextZoom);
            setPan({ x: Math.round(nextPanX), y: Math.round(nextPanY) });
          }
          return;
        }

        // 4. Touch pan canvas (1 finger)
        if (isPanning && e.touches.length === 1) {
          const t = e.touches[0];
          const dx = t.clientX - touchStateRef.current.touchStartPos.x;
          const dy = t.clientY - touchStateRef.current.touchStartPos.y;
          if (Math.hypot(dx, dy) > 3) touchStateRef.current.hasMoved = true;
          setPan({
            x: touchStateRef.current.startPan.x + dx,
            y: touchStateRef.current.startPan.y + dy
          });
        }
      };

      const handleCanvasTouchEnd = (e) => {
        // Drop dragged node
        if (draggingTouchNodeRef.current) {
          if (draggingTouchNodeRef.current.hasMoved) {
            saveSnapshot(nodes, edges);
          }
          draggingTouchNodeRef.current = null;
          setDraggingNodeId(null);
          setSnapLines([]);
          return;
        }

        // Connect port
        if (connectingTouchPortRef.current) {
          const fromInfo = connectingTouchPortRef.current;
          const t = e.changedTouches[0];
          if (t) {
            const cPos = screenToCanvas(t.clientX, t.clientY);
            const target = sizedNodes.find(n =>
              n.id !== fromInfo.nodeId &&
              cPos.x >= n.x && cPos.x <= n.x + n.width &&
              cPos.y >= n.y && cPos.y <= n.y + n.height
            );
            if (target) {
              const sn = sizedNodesMap[fromInfo.nodeId];
              const pair = getBestPortPair(sn, target, { fromPort: fromInfo.portDir });
              const newEdge = {
                id: 'edge_' + Date.now(),
                from: fromInfo.nodeId,
                to: target.id,
                fromPort: fromInfo.portDir,
                toPort: pair.toDir,
                label: '',
                style: activeConnectorStyle || 'orthogonal'
              };
              const nextE = [...edges, newEdge];
              setEdges(nextE);
              saveSnapshot(nodes, nextE);
            }
          }
          connectingTouchPortRef.current = null;
          setConnectingFrom(null);
          return;
        }

        if (e.touches.length === 0) {
          if (!touchStateRef.current.hasMoved && (Date.now() - touchStateRef.current.touchStartTime < 300)) {
            setSelectedNodeIds([]);
            setSelectedEdgeId(null);
          }
          setIsPanning(false);
          touchStateRef.current.isPinching = false;
        }
      };

      const handleNodeTouchStart = (e, node) => {
        e.stopPropagation();
        if (editingNodeId && editingNodeId !== node.id) saveInlineLabel();
        setSelectedEdgeId(null);
        setSelectedNodeIds([node.id]);

        if (e.touches.length === 1) {
          const t = e.touches[0];
          draggingTouchNodeRef.current = {
            nodeId: node.id,
            startX: t.clientX,
            startY: t.clientY,
            nodeStartX: node.x,
            nodeStartY: node.y,
            hasMoved: false
          };
          setDraggingNodeId(node.id);
        }
      };

      const handlePortTouchStart = (e, node, dir, portPos) => {
        e.stopPropagation();
        if (e.touches.length === 1) {
          connectingTouchPortRef.current = {
            nodeId: node.id,
            portDir: dir
          };
          setConnectingFrom({ nodeId: node.id, portDir: dir, port: portPos });
          const t = e.touches[0];
          const cPos = screenToCanvas(t.clientX, t.clientY);
          setMouseCanvasPos(cPos);
        }
      };

      const addNodeFromSidebar = (shapeItem) => {
        const colors = theme.nodeColors[shapeItem.id] || theme.nodeColors.process;
        const container = containerRef.current;
        const cWidth = container?.clientWidth || window.innerWidth;
        const cHeight = container?.clientHeight || (window.innerHeight - 68);
        const centerCanvas = screenToCanvas(cWidth / 2, cHeight / 2);

        const baseNode = {
          id: 'node_' + Date.now(),
          type: shapeItem.id,
          label: shapeItem.name,
          x: Math.round(centerCanvas.x - shapeItem.defaultWidth / 2),
          y: Math.round(centerCanvas.y - shapeItem.defaultHeight / 2),
          width: shapeItem.defaultWidth,
          height: shapeItem.defaultHeight,
          fill: colors.fill,
          stroke: colors.stroke,
          text: colors.text,
          font: 'Inter',
          fontSize: 13,
          fontWeight: '500',
          stepIndex: nodes.length + 1
        };
        const layout = computeAutoNodeLayout(baseNode);
        const newNode = { ...baseNode, width: layout.width, height: layout.height };
        handleUpdateNode(newNode.id, newNode, true);
        setSelectedNodeIds([newNode.id]);
        setSelectedEdgeId(null);
        setMobileDrawer(null);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const dataStr = e.dataTransfer.getData('application/json');
        if (!dataStr) return;
        try {
          const shapeItem = JSON.parse(dataStr);
          const canvasPos = screenToCanvas(e.clientX, e.clientY);
          const colors = theme.nodeColors[shapeItem.id] || theme.nodeColors.process;
          const baseNode = {
            id: 'node_' + Date.now(),
            type: shapeItem.id,
            label: shapeItem.name,
            width: shapeItem.defaultWidth,
            height: shapeItem.defaultHeight,
            fill: colors.fill,
            stroke: colors.stroke,
            text: colors.text,
            font: 'Inter',
            fontSize: 13,
            fontWeight: '500',
            stepIndex: nodes.length + 1
          };
          const layout = computeAutoNodeLayout(baseNode);
          const newNode = {
            ...baseNode,
            width: layout.width,
            height: layout.height,
            x: Math.round(canvasPos.x - layout.width / 2),
            y: Math.round(canvasPos.y - layout.height / 2)
          };
          handleUpdateNode(newNode.id, newNode, true);
          setSelectedNodeIds([newNode.id]);
        } catch (err) {}
      };

      const sizedNodesMap = {};
      const sizedNodes = nodes.map(n => {
        const activeNode = editingNodeId === n.id ? { ...n, label: tempLabel } : n;
        const layout = computeAutoNodeLayout(activeNode);
        const sn = { ...n, width: layout.width, height: layout.height, _lines: layout.lines, _lineHeight: layout.lineHeight };
        sizedNodesMap[n.id] = sn;
        return sn;
      });

      const selectedNode = sizedNodes.find(n => n.id === selectedNodeIds[0]);
      const selectedEdge = edges.find(e => e.id === selectedEdgeId);
      const defaultEdgeColor = theme.edgeStroke || '#736049';
      const selectedColor = theme.accent || '#7a5c3e';

      const handleImportFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.nodes && data.edges) {
              const fitted = data.nodes.map(n => {
                const l = computeAutoNodeLayout(n);
                return { ...n, width: l.width, height: l.height };
              });
              setNodes(fitted);
              setEdges(data.edges);
              saveSnapshot(fitted, data.edges);
            }
          } catch (err) {
            alert('Invalid JSON file.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const generateFlowchartSvgString = (padding = 48) => {
        if (!nodes || nodes.length === 0) {
          alert('Your canvas is empty. Add flowchart blocks before downloading.');
          return null;
        }

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        sizedNodes.forEach(n => {
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + n.width);
          maxY = Math.max(maxY, n.y + n.height);
        });

        const exportMinX = Math.round(minX - padding);
        const exportMinY = Math.round(minY - padding);
        const width = Math.max(200, Math.round(maxX - minX + padding * 2));
        const height = Math.max(160, Math.round(maxY - minY + padding * 2));

        const edgeColor = theme?.edgeStroke || '#736049';
        const bgColor = theme?.bgColor || '#f3ede0';

        const escapeXml = (str) =>
          String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${exportMinX} ${exportMinY} ${width} ${height}" width="${width}" height="${height}">`;

        svg += `<defs>
          <filter id="fc-node-shadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(74, 60, 44, 0.12)" />
          </filter>
          <marker id="fc-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <polygon points="0 0.5, 8.5 3.5, 0 6.5" fill="${edgeColor}" />
          </marker>
        </defs>`;

        // Clean background of the board (no grid dots, no sidebars, no UI)
        svg += `<rect x="${exportMinX}" y="${exportMinY}" width="${width}" height="${height}" fill="${bgColor}"/>`;

        // Edges / Connections
        edges.forEach(e => {
          const sn = sizedNodesMap[e.from];
          const tn = sizedNodesMap[e.to];
          if (!sn || !tn) return;
          const { fromPort, toPort } = getBestPortPair(sn, tn, e);
          const pathInfo = calculatePathData(fromPort, toPort, e.style || 'orthogonal');
          const strokeColor = e.stroke || edgeColor;

          svg += `<path d="${pathInfo.d}" fill="none" stroke="${strokeColor}" stroke-width="2" marker-end="url(#fc-arrow)" />`;

          if (e.label) {
            const isMostlyHoriz = Math.abs(toPort.x - fromPort.x) >= Math.abs(toPort.y - fromPort.y);
            const lx = pathInfo.midPoint.x + (isMostlyHoriz ? 0 : 18);
            const ly = pathInfo.midPoint.y + (isMostlyHoriz ? -12 : 0);
            const labelText = escapeXml(e.label);
            const labelWidth = Math.max(28, labelText.length * 7 + 12);
            svg += `<rect x="${lx - labelWidth / 2}" y="${ly - 9}" width="${labelWidth}" height="18" rx="5" fill="${bgColor}" stroke="${strokeColor}" stroke-width="0.8" opacity="0.95"/>`;
            svg += `<text x="${lx}" y="${ly + 4}" fill="${theme?.textDark ? '#3b3023' : '#2c251d'}" font-size="11" font-family="Inter, -apple-system, sans-serif" font-weight="500" text-anchor="middle">${labelText}</text>`;
          }
        });

        // Nodes
        sizedNodes.forEach(n => {
          const { x, y, width: nw, height: nh, type, fill, stroke } = n;
          const st = stroke || '#6d624d';
          svg += `<g transform="translate(${x}, ${y})">`;

          if (type === 'terminal' || type === 'pill') {
            const pillRadius = Math.round(Math.min(nw, nh) / 2);
            svg += `<rect width="${nw}" height="${nh}" rx="${pillRadius}" fill="${fill}" stroke="${st}" stroke-width="1.6" filter="url(#fc-node-shadow)"/>`;
          } else if (type === 'decision' || type === 'diamond') {
            svg += `<polygon points="${nw / 2},0 ${nw},${nh / 2} ${nw / 2},${nh} 0,${nh / 2}" stroke-linejoin="round" fill="${fill}" stroke="${st}" stroke-width="1.6" filter="url(#fc-node-shadow)"/>`;
          } else if (type === 'database' || type === 'cylinder') {
            const rx = nw / 2;
            const ry = 10;
            svg += `<g filter="url(#fc-node-shadow)">`;
            svg += `<path d="M 0 ${ry} v ${nh - 2 * ry} a ${rx} ${ry} 0 0 0 ${nw} 0 v -${nh - 2 * ry}" fill="${fill}" stroke="${st}" stroke-width="1.6"/>`;
            svg += `<ellipse cx="${rx}" cy="${ry}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${st}" stroke-width="1.6"/>`;
            svg += `</g>`;
          } else if (type === 'document') {
            svg += `<path d="M 0 0 H ${nw} V ${nh - 11} Q ${nw * 0.75} ${nh + 2} ${nw * 0.5} ${nh - 9} T 0 ${nh - 11} Z" fill="${fill}" stroke="${st}" stroke-width="1.6" filter="url(#fc-node-shadow)"/>`;
          } else if (type === 'input' || type === 'parallelogram') {
            const skew = Math.min(20, nw * 0.15);
            svg += `<polygon points="${skew},0 ${nw},0 ${nw - skew},${nh} 0,${nh}" stroke-linejoin="round" fill="${fill}" stroke="${st}" stroke-width="1.6" filter="url(#fc-node-shadow)"/>`;
          } else if (type === 'note') {
            svg += `<g filter="url(#fc-node-shadow)">`;
            svg += `<rect width="${nw}" height="${nh}" rx="6" fill="${fill}" stroke="${st}" stroke-width="1.5"/>`;
            svg += `<polygon points="${nw - 14},${nh} ${nw},${nh - 14} ${nw - 14},${nh - 14}" fill="rgba(90, 70, 45, 0.22)"/>`;
            svg += `</g>`;
          } else {
            svg += `<rect width="${nw}" height="${nh}" rx="10" fill="${fill}" stroke="${st}" stroke-width="1.6" filter="url(#fc-node-shadow)"/>`;
          }

          const lines = n._lines || [n.label];
          const lineHeight = n._lineHeight || 18;
          const fontSize = n.fontSize || 13;
          const totalTextHeight = lines.length * lineHeight;
          const startTextY = (nh - totalTextHeight) / 2 + fontSize * 0.82 + (type === 'database' ? 6 : 0) - (type === 'document' ? 4 : 0);

          svg += `<text x="${nw / 2}" fill="${n.text || '#2c251d'}" font-size="${fontSize}" font-family="Inter, -apple-system, sans-serif" text-anchor="middle" font-weight="500">`;
          lines.forEach((line, i) => {
            svg += `<tspan x="${nw / 2}" y="${startTextY + i * lineHeight}">${escapeXml(line)}</tspan>`;
          });
          svg += `</text>`;

          if (n.stepIndex) {
            const bx = type === 'decision' ? nw / 2 : type === 'input' ? nw - 10 : nw - 6;
            svg += `<g transform="translate(${bx}, -4)">
              <circle r="11" fill="#f6efe0" stroke="#7a6852" stroke-width="1.2"/>
              <text y="3.8" text-anchor="middle" fill="#3b3023" font-size="11" font-family="Inter, -apple-system, sans-serif" font-weight="600">${n.stepIndex}</text>
            </g>`;
          }

          svg += `</g>`;
        });

        svg += `</svg>`;
        return { svgStr: svg, width, height };
      };

      const downloadFlowchartImage = (customFilename = null) => {
        const result = generateFlowchartSvgString();
        if (!result) return;
        const { svgStr, width, height } = result;

        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = () => {
          try {
            const scale = 2; // 2x Retina high sharpness
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            const ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.scale(scale, scale);
              ctx.drawImage(img, 0, 0);
              const pngUrl = canvas.toDataURL('image/png');
              const link = document.createElement('a');
              link.download = customFilename || `flowchart-${Date.now()}.png`;
              link.href = pngUrl;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            }
          } catch (err) {
            const link = document.createElement('a');
            link.download = `flowchart-${Date.now()}.svg`;
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } finally {
            URL.revokeObjectURL(url);
          }
        };

        img.onerror = () => {
          const link = document.createElement('a');
          link.download = `flowchart-${Date.now()}.svg`;
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        };

        img.src = url;
      };

      return (
        <div className="h-screen w-screen flex flex-col bg-[#f3ede0] overflow-hidden font-sans">
          {/* HEADER */}
          <header className="h-[64px] bg-[#efe7d6] border-b border-[#d5c7ad] px-4 sm:px-6 flex items-center justify-between z-30 select-none shadow-[0_1px_3px_rgba(74,60,44,0.06)]">
            <div className="flex items-center gap-4 sm:gap-8">
              <div
                className="flex flex-col items-center cursor-pointer"
                onClick={() => fitNodesToView()}
                title="Click to Center & Fit Flowchart"
              >
                <span className="text-[20px] sm:text-[22px] font-semibold tracking-tight text-[#433627] leading-none font-serif">
                  FlowCanvas
                </span>
                <div className="flex items-center gap-1.5 mt-0.5 w-full justify-center">
                  <span className="h-[1px] flex-1 bg-[#9c8b70]" />
                  <span className="text-[8px] sm:text-[9px] font-semibold uppercase tracking-[0.22em] text-[#6d5d47]">STUDIO</span>
                  <span className="h-[1px] flex-1 bg-[#9c8b70]" />
                </div>
              </div>

              {/* Desktop Nav */}
              <nav className="hidden md:flex items-center gap-5 text-[13px] font-medium text-[#4a3e2e]">
                <button onClick={() => setShowTemplates(true)} className="hover:text-[#7c5d3b] transition-colors py-1 px-2 rounded-md hover:bg-[#e5dac5]/60">
                  Templates & Presets
                </button>
                <span className="h-3.5 w-[1px] bg-[#d5c7ad]" />
                <button onClick={() => fileInputRef.current?.click()} className="hover:text-[#7c5d3b] transition-colors py-1 px-2 rounded-md hover:bg-[#e5dac5]/60">
                  Import
                </button>
                <input ref={fileInputRef} type="file" accept=".json" onChange={handleImportFile} className="hidden" />
                <span className="h-3.5 w-[1px] bg-[#d5c7ad]" />
                <button onClick={() => setShowExport(true)} className="hover:text-[#7c5d3b] transition-colors py-1 px-2 rounded-md hover:bg-[#e5dac5]/60">
                  Export
                </button>
                <span className="h-3.5 w-[1px] bg-[#d5c7ad]" />
                <button
                  onClick={() => downloadFlowchartImage()}
                  className="flex items-center gap-1.5 py-1.5 px-3 rounded-lg bg-[#5e4933] hover:bg-[#4b3a27] text-[#fdfaf3] font-semibold transition shadow-xs text-xs"
                  title="Download picture of flowchart (PNG)"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                  <span>Download</span>
                </button>
              </nav>
            </div>

            <div className="flex items-center gap-2 sm:gap-3">
              {/* Mobile Quick Add Shapes Button */}
              <button
                onClick={() => setMobileDrawer('shapes')}
                className="md:hidden flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-[#7c6143] text-[#fdfaf3] text-xs font-semibold shadow-sm hover:bg-[#695136] active:scale-95 transition"
              >
                <span className="text-sm leading-none">+</span>
                <span>Shapes</span>
              </button>

              {/* Mobile Quick Download Button */}
              <button
                onClick={() => downloadFlowchartImage()}
                className="md:hidden flex items-center justify-center p-2 rounded-lg bg-[#5e4933] text-[#fdfaf3] shadow-sm active:scale-95 transition"
                title="Download Flowchart Image"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
              </button>

              {/* Undo / Redo / Zoom on Desktop */}
              <div className="hidden md:flex items-center gap-1 bg-[#e6dcc8]/80 px-2 py-1 rounded-lg border border-[#d2c3a8] text-[#544634] text-xs">
                <button onClick={handleUndo} disabled={historyIndex <= 0} className="px-1.5 py-0.5 rounded hover:bg-[#dcd0b8] disabled:opacity-30" title="Undo">↶</button>
                <button onClick={handleRedo} disabled={historyIndex >= history.length - 1} className="px-1.5 py-0.5 rounded hover:bg-[#dcd0b8] disabled:opacity-30" title="Redo">↷</button>
                <span className="h-3.5 w-[1px] bg-[#cbbba0] mx-1" />
                <button onClick={() => setZoom(Math.max(0.3, +(zoom - 0.1).toFixed(2)))} className="px-1.5 rounded hover:bg-[#dcd0b8]">-</button>
                <span onClick={() => fitNodesToView()} className="font-mono text-[11px] w-12 text-center cursor-pointer hover:underline" title="Click to auto-fit screen">{Math.round(zoom * 100)}%</span>
                <button onClick={() => setZoom(Math.min(2.2, +(zoom + 0.1).toFixed(2)))} className="px-1.5 rounded hover:bg-[#dcd0b8]">+</button>
              </div>

              {/* Present Flow */}
              <button
                onClick={() => { setPresStepIdx(0); setShowPresentation(true); }}
                disabled={nodes.length === 0}
                className="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg bg-[#7c6143] hover:bg-[#695136] active:scale-95 disabled:opacity-40 text-[#fdfaf3] font-medium text-xs sm:text-[13px] shadow-sm transition border border-[#634c33]"
              >
                Present
              </button>

              {/* Menu Button */}
              <div className="relative">
                <button onClick={() => setMenuOpen(!menuOpen)} className="p-1.5 sm:p-2 rounded-lg text-[#5c4d3a] hover:bg-[#e4d9c3] transition">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                </button>
                {menuOpen && (
                  <>
                    <div className="fixed inset-0 z-40" onClick={() => setMenuOpen(false)} />
                    <div className="absolute right-0 mt-2 w-56 rounded-xl bg-[#f5efe2] border border-[#cfc0a5] shadow-2xl py-2 px-3 z-50 text-xs text-[#3d3225] space-y-1.5">
                      {/* Mobile Only Nav items in dropdown */}
                      <div className="md:hidden border-b border-[#d8cbb3] pb-1.5 space-y-1">
                        <button
                          onClick={() => { setShowTemplates(true); setMenuOpen(false); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#e6dcc8] font-medium"
                        >
                          Templates & Presets
                        </button>
                        <button
                          onClick={() => { fileInputRef.current?.click(); setMenuOpen(false); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#e6dcc8] font-medium"
                        >
                          Import Flowchart JSON
                        </button>
                        <button
                          onClick={() => { setShowExport(true); setMenuOpen(false); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#e6dcc8] font-medium"
                        >
                          Export Diagram
                        </button>
                        <button
                          onClick={() => { downloadFlowchartImage(); setMenuOpen(false); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#e6dcc8] font-medium flex items-center gap-2 text-[#2c251d]"
                        >
                          <svg className="w-3.5 h-3.5 text-[#7c6143]" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                          </svg>
                          <span>Download Picture (PNG)</span>
                        </button>
                      </div>

                      <button
                        onClick={() => { fitNodesToView(); setMenuOpen(false); }}
                        className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-[#e6dcc8] font-medium flex items-center justify-between"
                      >
                        <span>Center & Fit Flowchart</span>
                        <span className="text-[11px] opacity-70">⛶</span>
                      </button>

                      <div className="font-semibold text-[10px] uppercase tracking-wider text-[#7d6c55] px-1 pt-1">Theme</div>
                      {PRESENTATION_THEMES.map(t => (
                        <button
                          key={t.id}
                          onClick={() => { setTheme(t); setMenuOpen(false); }}
                          className={`w-full text-left px-2.5 py-1.5 rounded-lg ${theme.id === t.id ? 'bg-[#7c6143] text-[#fdfaf3]' : 'hover:bg-[#e6dcc8]'}`}
                        >
                          {t.name}
                        </button>
                      ))}

                      <div className="border-t border-[#d8cbb3] pt-1.5">
                        <button
                          onClick={() => { setNodes([]); setEdges([]); saveSnapshot([], []); setMenuOpen(false); }}
                          className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-rose-500/15 text-rose-700 font-medium"
                        >
                          Clear Canvas
                        </button>
                      </div>
                    </div>
                  </>
                )}
              </div>
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <div className="flex-1 flex overflow-hidden relative">
            {/* LEFT SIDEBAR (Desktop) */}
            <aside className="hidden md:flex w-[248px] bg-[#ede4d3] border-r border-[#d5c7ad] flex-col z-20 select-none">
              <div className="px-5 pt-6 pb-3">
                <h2 className="text-[12px] font-semibold uppercase tracking-[0.08em] text-[#4a3e2e]">FLOW SHAPES</h2>
              </div>
              <div className="flex-1 overflow-y-auto px-4 pb-4 space-y-2.5">
                {SHAPE_TYPES.map(shape => (
                  <div
                    key={shape.id}
                    draggable
                    onDragStart={(e) => {
                      e.dataTransfer.setData('application/json', JSON.stringify(shape));
                      e.dataTransfer.effectAllowed = 'copy';
                    }}
                    onClick={() => addNodeFromSidebar(shape)}
                    className="group flex items-center gap-3.5 px-3.5 py-3 rounded-xl bg-[#f3ecde]/80 hover:bg-[#f8f3e8] border border-[#d6c8b0] hover:border-[#9e8462] cursor-grab active:cursor-grabbing transition-all shadow-sm"
                  >
                    <ShapeMiniature id={shape.id} />
                    <div className="text-[13px] font-medium text-[#3b3023] truncate">{shape.name}</div>
                  </div>
                ))}

                <div className="pt-4 mt-4 border-t border-[#d8cbb3]">
                  <h3 className="text-[11px] font-semibold uppercase tracking-[0.08em] text-[#6d5d47] mb-2 px-1">Default Flow Line</h3>
                  <div className="grid grid-cols-3 gap-1.5 p-1 bg-[#e3d8c3] rounded-xl border border-[#cfc0a5]">
                    {[
                      { id: 'orthogonal', label: 'Step' },
                      { id: 'curved', label: 'Curve' },
                      { id: 'straight', label: 'Direct' }
                    ].map(st => (
                      <button
                        key={st.id}
                        onClick={() => setActiveConnectorStyle(st.id)}
                        className={`py-1.5 px-2 rounded-lg text-[11px] font-medium transition ${
                          activeConnectorStyle === st.id ? 'bg-[#7c6143] text-[#fdfaf3]' : 'text-[#5c4d3a] hover:bg-[#d8cbb3]/60'
                        }`}
                      >
                        {st.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </aside>

            {/* CENTER CANVAS */}
            <div
              ref={containerRef}
              onWheel={handleWheel}
              onMouseDown={handleCanvasMouseDown}
              onMouseMove={handleCanvasMouseMove}
              onMouseUp={handleCanvasMouseUp}
              onTouchStart={handleCanvasTouchStart}
              onTouchMove={handleCanvasTouchMove}
              onTouchEnd={handleCanvasTouchEnd}
              onTouchCancel={handleCanvasTouchEnd}
              onDrop={handleDrop}
              onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }}
              style={{ touchAction: 'none' }}
              className={`relative flex-1 h-full w-full overflow-hidden select-none cursor-default canvas-bg ${theme.canvasBgClass}`}
            >
              <svg className="w-full h-full absolute inset-0 pointer-events-none" style={{ touchAction: 'none' }}>
                <defs>
                  <marker id="arrowhead-end" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0.5, 8.5 3.5, 0 6.5" fill={defaultEdgeColor} />
                  </marker>
                  <marker id="arrowhead-selected" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0.5, 8.5 3.5, 0 6.5" fill={selectedColor} />
                  </marker>
                </defs>

                <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
                  {snapLines.map((line, idx) => (
                    line.type === 'x' ? (
                      <line key={idx} x1={line.x} y1={-10000} x2={line.x} y2={10000} stroke="#9e7b56" strokeDasharray="4 4" strokeWidth="1" />
                    ) : (
                      <line key={idx} x1={-10000} y1={line.y} x2={10000} y2={line.y} stroke="#9e7b56" strokeDasharray="4 4" strokeWidth="1" />
                    )
                  ))}

                  {/* Edges */}
                  {edges.map(edge => {
                    const sn = sizedNodesMap[edge.from];
                    const tn = sizedNodesMap[edge.to];
                    if (!sn || !tn) return null;
                    const { fromPort, toPort } = getBestPortPair(sn, tn, edge);
                    const pathInfo = calculatePathData(fromPort, toPort, edge.style || 'orthogonal');
                    const isSel = selectedEdgeId === edge.id;
                    const isMostlyHoriz = Math.abs(toPort.x - fromPort.x) >= Math.abs(toPort.y - fromPort.y);
                    const labelOffsetX = isMostlyHoriz ? 0 : 18;
                    const labelOffsetY = isMostlyHoriz ? -12 : 0;

                    return (
                      <g key={edge.id} className="pointer-events-auto cursor-pointer">
                        <path
                          d={pathInfo.d}
                          fill="none"
                          stroke="transparent"
                          strokeWidth="24"
                          onClick={(e) => { e.stopPropagation(); setSelectedEdgeId(edge.id); setSelectedNodeIds([]); }}
                          onDoubleClick={(e) => { e.stopPropagation(); setEditingEdgeId(edge.id); setTempLabel(edge.label || ''); }}
                        />
                        <path
                          d={pathInfo.d}
                          fill="none"
                          stroke={isSel ? selectedColor : (edge.stroke || defaultEdgeColor)}
                          strokeWidth={isSel ? '2.4' : '1.6'}
                          markerEnd={isSel ? 'url(#arrowhead-selected)' : 'url(#arrowhead-end)'}
                        />
                        {edge.label && (
                          <g
                            transform={`translate(${pathInfo.midPoint.x + labelOffsetX}, ${pathInfo.midPoint.y + labelOffsetY})`}
                            onClick={(e) => { e.stopPropagation(); setSelectedEdgeId(edge.id); setSelectedNodeIds([]); }}
                          >
                            <rect
                              x={-(edge.label.length * 3.4 + 6)}
                              y="-9"
                              width={edge.label.length * 6.8 + 12}
                              height="18"
                              rx="4"
                              fill={theme.bgColor || '#f3ede0'}
                              fillOpacity="0.88"
                            />
                            <text x="0" y="3.5" textAnchor="middle" fill={theme.textDark ? '#3b3023' : '#f8fafc'} fontSize="12" fontWeight="500">
                              {edge.label}
                            </text>
                          </g>
                        )}
                      </g>
                    );
                  })}

                  {connectingFrom && (
                    <path
                      d={calculatePathData(connectingFrom.port, { x: mouseCanvasPos.x, y: mouseCanvasPos.y, dir: 'center' }, activeConnectorStyle).d}
                      fill="none"
                      stroke={selectedColor}
                      strokeWidth="2"
                      strokeDasharray="5 4"
                      markerEnd="url(#arrowhead-selected)"
                    />
                  )}

                  {/* Nodes */}
                  {sizedNodes.map(node => {
                    const isSel = selectedNodeIds.includes(node.id);
                    const isEditing = editingNodeId === node.id;
                    const ports = getNodePorts(node);
                    const lines = node._lines || [node.label];
                    const lineHeight = node._lineHeight || 18;
                    const fontSize = node.fontSize || 13;
                    const totalTextHeight = lines.length * lineHeight;
                    const startTextY = (node.height - totalTextHeight) / 2 + fontSize * 0.82 + (node.type === 'database' ? 6 : 0) - (node.type === 'document' ? 4 : 0);
                    const badgeX = node.type === 'decision' ? node.width / 2 : node.type === 'input' ? node.width - 10 : node.width - 6;

                    return (
                      <g
                        key={node.id}
                        transform={`translate(${node.x}, ${node.y})`}
                        style={{ touchAction: 'none' }}
                        onMouseDown={(e) => {
                          e.stopPropagation();
                          if (editingNodeId && editingNodeId !== node.id) saveInlineLabel();
                          setSelectedEdgeId(null);
                          setSelectedNodeIds([node.id]);
                          const cPos = screenToCanvas(e.clientX, e.clientY);
                          setDraggingNodeId(node.id);
                          setDragOffset({ x: cPos.x - node.x, y: cPos.y - node.y });
                        }}
                        onTouchStart={(e) => handleNodeTouchStart(e, node)}
                        onMouseUp={(e) => {
                          if (connectingFrom && connectingFrom.nodeId !== node.id) {
                            e.stopPropagation();
                            const sn = sizedNodesMap[connectingFrom.nodeId];
                            const pair = getBestPortPair(sn, node, { fromPort: connectingFrom.portDir });
                            const newEdge = {
                              id: 'edge_' + Date.now(),
                              from: connectingFrom.nodeId,
                              to: node.id,
                              fromPort: connectingFrom.portDir,
                              toPort: pair.toDir,
                              label: '',
                              style: activeConnectorStyle || 'orthogonal'
                            };
                            const nextE = [...edges, newEdge];
                            setEdges(nextE);
                            saveSnapshot(nodes, nextE);
                            setConnectingFrom(null);
                          }
                        }}
                        onDoubleClick={(e) => {
                          e.stopPropagation();
                          setEditingNodeId(node.id);
                          setTempLabel(node.label);
                        }}
                        className="pointer-events-auto group cursor-grab active:cursor-grabbing"
                      >
                        {renderNodeSvgShape(node, isSel, theme)}

                        {isEditing ? (
                          <foreignObject x="8" y="8" width={Math.max(80, node.width - 16)} height={Math.max(40, node.height - 16)}>
                            <div className="h-full w-full flex items-center justify-center">
                              <textarea
                                autoFocus
                                value={tempLabel}
                                onChange={(e) => {
                                  setTempLabel(e.target.value);
                                  handleUpdateNode(node.id, { label: e.target.value }, false, true);
                                }}
                                onBlur={saveInlineLabel}
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveInlineLabel(); }
                                }}
                                className="w-full h-full bg-[#fdfaf3]/95 text-[#2c251d] text-xs p-1.5 rounded-lg border border-[#7c6143] outline-none text-center resize-none font-medium"
                              />
                            </div>
                          </foreignObject>
                        ) : (
                          <text
                            x={node.width / 2}
                            textAnchor="middle"
                            fill={node.text || (theme.textDark ? '#2c251d' : '#f8fafc')}
                            fontSize={fontSize}
                            fontWeight={node.fontWeight || '500'}
                            fontFamily={node.font || 'Inter'}
                            className="pointer-events-none select-none"
                          >
                            {lines.map((line, i) => (
                              <tspan key={i} x={node.width / 2} y={startTextY + i * lineHeight}>
                                {line}
                              </tspan>
                            ))}
                          </text>
                        )}

                        {node.stepIndex && (
                          <g transform={`translate(${badgeX}, -4)`} className="pointer-events-none">
                            <circle r="11.5" fill="#f6efe0" stroke="#7a6852" strokeWidth="1.2" />
                            <text y="3.8" textAnchor="middle" fill="#3b3023" fontSize="11" fontWeight="600">
                              {node.stepIndex}
                            </text>
                          </g>
                        )}

                        {['top', 'right', 'bottom', 'left'].map(dir => {
                          const p = ports[dir];
                          const lx = p.x - node.x;
                          const ly = p.y - node.y;
                          return (
                            <g key={dir}>
                              <circle
                                cx={lx}
                                cy={ly}
                                r="16"
                                fill="transparent"
                                onMouseDown={(e) => {
                                  e.stopPropagation();
                                  setConnectingFrom({ nodeId: node.id, portDir: dir, port: ports[dir] });
                                }}
                                onTouchStart={(e) => handlePortTouchStart(e, node, dir, ports[dir])}
                                onMouseUp={(e) => {
                                  e.stopPropagation();
                                  if (connectingFrom && connectingFrom.nodeId !== node.id) {
                                    const newEdge = {
                                      id: 'edge_' + Date.now(),
                                      from: connectingFrom.nodeId,
                                      to: node.id,
                                      fromPort: connectingFrom.portDir,
                                      toPort: dir,
                                      label: '',
                                      style: activeConnectorStyle || 'orthogonal'
                                    };
                                    const nextE = [...edges, newEdge];
                                    setEdges(nextE);
                                    saveSnapshot(nodes, nextE);
                                  }
                                  setConnectingFrom(null);
                                }}
                                className="cursor-crosshair pointer-events-auto"
                              />
                              <circle
                                cx={lx}
                                cy={ly}
                                r="5.5"
                                fill="#f6efe0"
                                stroke="#6d5d47"
                                strokeWidth="1.8"
                                className="pointer-events-none opacity-60 md:opacity-0 group-hover:opacity-100 transition-opacity"
                              />
                            </g>
                          );
                        })}
                      </g>
                    );
                  })}
                </g>
              </svg>

              {/* FLOATING CONTROLS (Bottom Right) */}
              <div className="absolute bottom-4 right-4 z-30 flex items-center gap-1.5 bg-[#ede4d3]/95 backdrop-blur-xs border border-[#cfc0a5] shadow-lg rounded-xl p-1 text-[#4a3e2e]">
                <button
                  onClick={handleUndo}
                  disabled={historyIndex <= 0}
                  className="p-2 rounded-lg hover:bg-[#ded2bc] disabled:opacity-30 transition"
                  title="Undo"
                >
                  <span className="text-sm font-bold">↶</span>
                </button>
                <button
                  onClick={handleRedo}
                  disabled={historyIndex >= history.length - 1}
                  className="p-2 rounded-lg hover:bg-[#ded2bc] disabled:opacity-30 transition"
                  title="Redo"
                >
                  <span className="text-sm font-bold">↷</span>
                </button>
                <span className="h-4 w-[1px] bg-[#cfc0a5] mx-0.5" />
                <button
                  onClick={() => setZoom(Math.max(0.3, +(zoom - 0.1).toFixed(2)))}
                  className="p-2 rounded-lg hover:bg-[#ded2bc] transition"
                  title="Zoom Out"
                >
                  <span className="text-sm font-bold">−</span>
                </button>
                <button
                  onClick={() => fitNodesToView()}
                  className="px-2 py-1 rounded-lg hover:bg-[#ded2bc] font-mono text-xs font-semibold transition"
                  title="Center & Fit Flowchart"
                >
                  {Math.round(zoom * 100)}%
                </button>
                <button
                  onClick={() => setZoom(Math.min(2.2, +(zoom + 0.1).toFixed(2)))}
                  className="p-2 rounded-lg hover:bg-[#ded2bc] transition"
                  title="Zoom In"
                >
                  <span className="text-sm font-bold">+</span>
                </button>
                <span className="h-4 w-[1px] bg-[#cfc0a5] mx-0.5" />
                <button
                  onClick={() => downloadFlowchartImage()}
                  className="p-2 rounded-lg hover:bg-[#ded2bc] text-[#5c442d] transition"
                  title="Download picture of flowchart (PNG)"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                </button>
              </div>

              {/* MOBILE FLOATING ACTION PILL (When item selected) */}
              {(selectedNode || selectedEdge) && (
                <div className="md:hidden fixed bottom-18 left-1/2 -translate-x/1/2 z-40 bg-[#f5efe2] border border-[#cfc0a5] shadow-2xl rounded-full px-3.5 py-2 flex items-center gap-2.5 text-xs text-[#2c251d]">
